# Sheldon 插件配置
# 加载顺序：completions → 路径工具 → 交互增强 → 语法高亮 → 主题（必须最后）
#
# 静态缓存：zshrc 中检测配置/锁文件变化后自动重新生成
# 位置：$ZSH_CACHE_DIR/sheldon_static.zsh

shell = "zsh"

# ---- 1. 补全增强 ----
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
apply = ["source"]

# ---- 2. 智能跳转 ----
# 存在性守卫：zoxide 未安装时静默跳过（可移植性）
[plugins.zoxide]
inline = 'command -v zoxide >/dev/null 2>&1 && eval "$(zoxide init zsh)"'

# ---- 3. 自动建议 ----
[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["source"]

# ---- 4. 语法高亮（必须最后加载，以捕获所有 widget 变更） ----
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
apply = ["source"]

# ---- 5. 提示符主题 ----
[plugins.starship]
inline = 'eval "$(starship init zsh)"'

# ---- 6. 补全初始化 ----
[plugins.compinit]
inline = """
autoload -Uz compinit
compinit -d "$XDG_CACHE_HOME/zsh/zcompdump-$ZSH_VERSION"
"""
